<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>TimeFlow</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#6C63FF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="TimeFlow"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0A0A0F;color:#E8E8F0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:85px;}
input,button,select,textarea{font-family:inherit;}
button{cursor:pointer;}
:root{
  --bg:#0A0A0F;--sur:#14141E;--sur2:#1C1C2A;--bor:#252535;--bor2:#2E2E42;
  --txt:#E8E8F0;--mut:#6B6B8A;--acc:#6C63FF;
  --grn:#43D9A3;--red:#FF6B6B;--yel:#FFB347;--blu:#4FC3F7;
}
/* HEADER */
#hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:17px;font-weight:800;}.logo span{color:var(--acc);}
/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bor);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nb{flex:1;padding:8px 2px 6px;border:none;background:none;color:var(--mut);font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.nb .ic{font-size:19px;line-height:1;}
.nb.on{color:var(--acc);}
/* FAB */
#fab{position:fixed;bottom:70px;right:16px;width:50px;height:50px;background:var(--acc);border:none;border-radius:50%;font-size:24px;color:#fff;box-shadow:0 4px 16px #6C63FF66;display:flex;align-items:center;justify-content:center;z-index:99;}
/* TOAST */
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--sur2);border:1px solid var(--acc)55;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s;white-space:nowrap;pointer-events:none;}
#toast.on{transform:translateX(-50%) translateY(0);}
/* OVERLAY */
#ov{position:fixed;inset:0;background:#000C;z-index:200;display:none;align-items:flex-end;justify-content:center;}
#ov.on{display:flex;}
#ob{background:var(--sur);border:1px solid var(--bor2);border-radius:20px 20px 0 0;padding:18px 16px 36px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;}
.oh{width:32px;height:4px;background:var(--bor2);border-radius:2px;margin:0 auto 14px;}
/* FORM */
.fl{margin-bottom:12px;}
.fl label{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;display:block;margin-bottom:4px;}
.fl input,.fl select,.fl textarea{width:100%;background:var(--bg);border:1px solid var(--bor2);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:14px;outline:none;}
.fl textarea{resize:vertical;min-height:52px;}
.fl input::placeholder{color:var(--mut);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dp{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dp button{padding:7px 2px;border-radius:6px;border:1px solid var(--bor2);background:var(--bg);color:var(--mut);font-size:10px;font-weight:700;cursor:pointer;}
.dp button.on{background:var(--acc)22;border-color:var(--acc);color:var(--acc);}
.cp{display:flex;gap:6px;flex-wrap:wrap;}
.cd{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.cd.on{border-color:#fff;transform:scale(1.15);}
.sep{border:none;border-top:1px solid var(--bor);margin:14px 0;}
.slbl{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:10px;}
.utp{display:flex;flex-direction:column;gap:5px;}
.upill{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;border:1px solid var(--bor2);background:var(--bg);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:left;}
.upill.on{border-color:var(--acc);color:var(--acc);background:var(--acc)18;}
.upill .ui{font-size:18px;}
.pbtn{width:100%;padding:12px;background:var(--acc);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;margin-top:4px;}
.sbtn{width:100%;padding:10px;background:none;border:1px solid var(--red)44;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;margin-top:6px;}
/* CARDS */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
.card.run{border-color:var(--cc);}
.ch{display:flex;align-items:center;gap:10px;}
.ci{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;}
.cn{font-size:14px;font-weight:700;cursor:pointer;}
.cm{font-size:10px;color:var(--mut);margin-top:2px;}
.cs{font-size:10px;margin-top:2px;}
.ca{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto;}
.btn-s{padding:7px 11px;border:1px solid var(--bor2);border-radius:7px;background:var(--bg);font-size:11px;font-weight:700;}
.btn-go{padding:7px 11px;border:none;border-radius:7px;color:#fff;font-size:11px;font-weight:700;}
.btn-e{background:none;border:none;color:var(--mut);font-size:14px;padding:3px 5px;}
.pb{background:var(--bor);border-radius:3px;height:3px;margin-top:5px;}
.pf{height:100%;border-radius:3px;transition:width .4s;}
/* BANNER */
#ban{margin:0 14px 12px;border-radius:14px;padding:12px 15px;display:none;}
#ban.on{display:flex;justify-content:space-between;align-items:center;}
/* DAY HEADER */
#dh{padding:14px 14px 10px;max-width:600px;margin:0 auto;}
.dg{font-size:22px;font-weight:800;}
.dd{font-size:12px;color:var(--mut);margin-top:2px;}
.dn{font-size:11px;color:var(--acc);font-weight:600;margin-top:4px;}
.dpb{background:var(--bor);border-radius:4px;height:4px;margin:10px 0 3px;}
.dpf{height:100%;border-radius:4px;background:var(--acc);}
.dpl{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);}
/* TIMELINE */
#tl{padding:0 14px;max-width:600px;margin:0 auto 10px;}
.tlw{position:relative;padding-left:48px;}
.tax{position:absolute;left:0;top:0;bottom:0;width:40px;}
.ttick{position:absolute;right:6px;font-size:9px;color:var(--mut);transform:translateY(-50%);white-space:nowrap;font-weight:600;}
.aline{position:absolute;left:39px;top:0;bottom:0;width:1px;background:var(--bor);}
.nline{position:absolute;left:39px;right:0;height:2px;background:var(--red);}
.ndot{position:absolute;left:35px;width:9px;height:9px;border-radius:50%;background:var(--red);top:-3px;}
.nlbl{position:absolute;left:46px;top:-8px;font-size:9px;color:var(--red);font-weight:700;}
.tb{position:absolute;left:0;right:0;border-radius:8px;padding:4px 8px;cursor:pointer;border-left:3px solid var(--cc);}
.tbn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cc);}
.tbt{font-size:9px;color:var(--cc);opacity:.7;margin-top:1px;}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.sb{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:12px 13px;}
.sl{font-size:9px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:3px;}
.sv{font-size:19px;font-weight:800;}
.ss{font-size:10px;color:var(--mut);margin-top:1px;}
.ab{border-radius:8px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px;}
.ab.w{background:#FFB34718;border:1px solid #FFB34744;}
.ab.d{background:#FF6B6B18;border:1px solid #FF6B6B44;}
.ab.g{background:#43D9A318;border:1px solid #43D9A344;}
.ai{font-size:15px;flex-shrink:0;}
.at{font-size:12px;line-height:1.5;}
.at strong{font-weight:700;display:block;}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.cl{font-size:11px;font-weight:600;width:75px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbw{flex:1;background:var(--bor);border-radius:4px;height:6px;}
.cbf{height:100%;border-radius:4px;}
.ct{font-size:10px;color:var(--mut);width:30px;text-align:right;flex-shrink:0;}
.pjb{background:linear-gradient(135deg,var(--acc)18,var(--acc)08);border:1px solid var(--acc)33;border-radius:14px;padding:13px 15px;margin-bottom:10px;}
.pjr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bor);}
.pjr:last-child{border-bottom:none;}
/* PROGRESS TAB */
.pgc{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
.pgh{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.pgi{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.pgn{font-size:14px;font-weight:800;}
.pgm{font-size:10px;color:var(--mut);margin-top:1px;}
.pgt{font-size:16px;font-weight:800;}
.pgbar{background:var(--bor);border-radius:5px;height:9px;overflow:hidden;margin:5px 0;}
.pgbf{height:100%;border-radius:5px;transition:width .5s;}
.pgln{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);}
.wbars{display:flex;align-items:flex-end;gap:4px;height:40px;margin-top:6px;}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.wbf{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.wbl{font-size:8px;}
/* RECAP */
.wsc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none;}
.wsc::-webkit-scrollbar{display:none;}
.wch{padding:5px 12px;border-radius:20px;border:1px solid var(--bor2);background:var(--bg);color:var(--mut);font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;cursor:pointer;}
.wch.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.rr{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;margin-bottom:9px;}
.dbs{display:flex;gap:3px;margin-top:8px;}
.dbc{flex:1;text-align:center;}
.dbbg{background:var(--bor);border-radius:3px;height:32px;display:flex;align-items:flex-end;overflow:hidden;}
.dbf{width:100%;border-radius:3px;}
.dbl{font-size:9px;color:var(--mut);}
.dbl.td{color:var(--txt);font-weight:700;}
/* HISTORY */
.hc{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;margin-bottom:9px;}
.htg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.ht{padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;}
/* UNIT PROMPT */
.upin{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.upin input{flex:1;text-align:center;font-size:28px;font-weight:800;background:var(--bg);border-radius:10px;padding:10px;outline:none;}
.upin button{width:42px;height:42px;border-radius:50%;border:1px solid var(--bor2);background:var(--bg);color:var(--txt);font-size:20px;font-weight:700;flex-shrink:0;}
/* CELEBRATION */
#cel{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000E;text-align:center;padding:30px;}
#cel.on{display:flex;}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.cp2{position:absolute;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
.ce{font-size:68px;margin-bottom:14px;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.ct2{font-size:24px;font-weight:800;margin-bottom:8px;}
.cv{font-size:30px;font-weight:800;margin-bottom:3px;}
.csl{font-size:11px;color:var(--mut);margin-bottom:18px;}
.csb{font-size:14px;color:var(--mut);line-height:1.6;margin-bottom:20px;}
/* STREAK */
.sgd{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px;}
.sd{width:21px;height:21px;border-radius:4px;background:var(--bor);font-size:8px;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700;}
.sd.dk{background:var(--grn)33;color:var(--grn);}
.sd.dp2{background:var(--yel)33;color:var(--yel);}
.sd.dm{background:var(--red)1A;color:var(--red)33;}
.sd.dt{border:1px solid var(--acc);}
/* EMPTY */
.empty{text-align:center;padding:44px 20px;color:var(--mut);}
.empty .ej{font-size:38px;margin-bottom:10px;}
.empty p{font-size:13px;line-height:1.7;}
/* FICHE */
.fi{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
.fs{background:var(--bg);border:1px solid var(--bor2);border-radius:10px;padding:11px 12px;}
.fsl{font-size:9px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:3px;}
.fsv{font-size:18px;font-weight:800;}
.fss{font-size:10px;color:var(--mut);margin-top:1px;}
</style>
</head>
<body>

<div id="toast"></div>

<!-- MODAL -->
<div id="ov"><div id="ob"><div class="oh"></div><div id="ot" style="font-size:16px;font-weight:800;margin-bottom:14px;"></div><div id="oc"></div></div></div>

<!-- CELEBRATION -->
<div id="cel"><div class="cf" id="cf"></div><div id="cc"></div></div>

<!-- HEADER -->
<div id="hdr">
  <div><div class="logo">⏱ Time<span>Flow</span></div></div>
  <div id="clk" style="font-size:13px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums;"></div>
</div>

<!-- DAY HEADER (tracker only) -->
<div id="dh" style="display:none;"></div>

<!-- ACTIVE BANNER -->
<div id="ban"></div>

<!-- TIMELINE -->
<div id="tl"></div>

<!-- MAIN CONTENT -->
<div id="mc" style="padding:0 14px;max-width:600px;margin:0 auto;"></div>

<!-- FAB -->
<button id="fab" onclick="openAdd()">+</button>

<!-- NAV -->
<nav id="nav">
  <button class="nb on" onclick="go('day')" id="n-day"><span class="ic">🗓️</span>Journée</button>
  <button class="nb" onclick="go('prog')" id="n-prog"><span class="ic">📈</span>Progression</button>
  <button class="nb" onclick="go('dash')" id="n-dash"><span class="ic">📊</span>Dashboard</button>
  <button class="nb" onclick="go('recap')" id="n-recap"><span class="ic">📅</span>Récap</button>
  <button class="nb" onclick="go('hist')" id="n-hist"><span class="ic">🗂️</span>Historique</button>
</nav>

<script>
// ── CONSTANTS ────────────────────────────────────────────
const COLORS=['#6C63FF','#FF6B6B','#43D9A3','#FFB347','#4FC3F7','#F06292','#AED581','#FF8A65','#BA68C8','#4DB6AC'];
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYSF=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
const CATS=['💼 Travail','🔧 Métier','🚀 Projets','💪 Santé','📚 Formation','🏠 Perso'];
const EMOJIS=['⏱','🔧','💼','🚀','📚','💪','🏃','🎯','💡','🎸','🙏','🌿','💰','🏠','✍️','🎓','🔨','📖','📱','🎵'];
const UNITS=[
  {id:'none',  lbl:'Heures seulement', icon:'⏱', u:'',       p:''},
  {id:'pages', lbl:'Pages (livre)',     icon:'📖', u:'page',   p:'pages'},
  {id:'mods',  lbl:'Modules',           icon:'🎓', u:'module', p:'modules'},
  {id:'exos',  lbl:'Exercices',         icon:'✏️', u:'exercice',p:'exercices'},
  {id:'custom',lbl:'Personnalisé',      icon:'🔢', u:'',       p:''},
];
const RECS=['Quotidienne','Hebdomadaire','Tous les 2 jours','Tous les 3 jours','Sans répétition'];
const SK='tf_v1';

// ── DATA ──────────────────────────────────────────────────
function ld(){try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){}return{acts:[],sess:[]};}
function sv(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
let DB=ld();

// ── STATE ─────────────────────────────────────────────────
let timer=null; // {aid,start}
let elapsed=0;
let ti=null; // interval
let tab='day';
let dispWk=null;
let editId=null;
let nad={color:COLORS[0],emoji:'⏱',days:[1,2,3,4,5],cat:'💼 Travail',rec:'Quotidienne',unit:'none'};
let pendUnit=null; // {act,sess}

// ── UTILS ─────────────────────────────────────────────────
const pad=n=>String(n).padStart(2,'0');
const fmtFull=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
function fmtS(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(h>0&&m>0)return h+'h '+m+'m';
  if(h>0)return h+'h';
  return m+'m';
}
function getDay(){const d=new Date().getDay();return d===0?6:d-1;}
function getWk(date){
  const d=date?new Date(date):new Date();
  d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function wkLbl(wk){
  if(!wk)return'';
  try{const d=new Date(wk);return'Sem. '+d.getDate()+' '+MONTHS[d.getMonth()];}
  catch(e){return wk;}
}
function totFor(aid,sess){return sess.filter(s=>s.aid===aid).reduce((a,s)=>a+s.dur,0);}
function totDay(aid,day,sess){return sess.filter(s=>s.aid===aid&&s.day===day).reduce((a,s)=>a+s.dur,0);}
function t2m(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function getStreak(aid){
  const act=DB.acts.find(a=>a.id===aid);
  if(!act||!act.days||!act.days.length)return 0;
  let streak=0;const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const di=d.getDay()===0?6:d.getDay()-1;
    if(!act.days.includes(di))continue;
    const wk=getWk(d);
    const done=DB.sess.filter(s=>s.aid===aid&&s.wk===wk&&s.day===di).reduce((a,s)=>a+s.dur,0);
    if(done>=300)streak++;else break;
  }
  return streak;
}
function getUDone(act){
  const base=act.udone||0;
  const fromSess=DB.sess.filter(s=>s.aid===act.id).reduce((a,s)=>a+(s.ua||0),0);
  return base+fromSess;
}
function getULbl(act,plural){
  if(!act.unit||act.unit==='none')return '';
  if(act.unit==='custom')return act.customU||(plural?'unités':'unité');
  const ut=UNITS.find(u=>u.id===act.unit);
  return plural?(ut?ut.p:'unités'):(ut?ut.u:'unité');
}
function getProj(act){
  if(!act.goalLT)return null;
  const done=DB.sess.filter(s=>s.aid===act.id).reduce((a,s)=>a+s.dur,0)/3600;
  const rem=act.goalLT-done;
  if(rem<=0)return{done:true};
  const wg=act.goalW||1;
  const wl=rem/wg;
  const dt=new Date();dt.setDate(dt.getDate()+Math.ceil(wl*7));
  return{done:false,date:dt,weeks:Math.ceil(wl),pct:Math.round((done/act.goalLT)*100),rem:Math.round(rem)};
}
function getLast30(aid){
  const r=[];const today=new Date();today.setHours(0,0,0,0);
  for(let i=29;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const di=d.getDay()===0?6:d.getDay()-1;
    const wk=getWk(d);
    const done=DB.sess.filter(s=>s.aid===aid&&s.wk===wk&&s.day===di).reduce((a,s)=>a+s.dur,0);
    const act=DB.acts.find(a=>a.id===aid);
    r.push({date:d,di,done,sched:act&&act.days&&act.days.includes(di)});
  }
  return r;
}

// ── TOAST ─────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2500);
}

// ── MODAL ─────────────────────────────────────────────────
function openModal(title,html){
  document.getElementById('ot').textContent=title;
  document.getElementById('oc').innerHTML=html;
  document.getElementById('ov').classList.add('on');
}
function closeModal(){document.getElementById('ov').classList.remove('on');}

// ── CLOCK ─────────────────────────────────────────────────
function updateClock(){
  const n=new Date();
  document.getElementById('clk').textContent=pad(n.getHours())+':'+pad(n.getMinutes());
}
updateClock();setInterval(updateClock,30000);

// ── TIMER ─────────────────────────────────────────────────
function startTimer(aid){
  if(timer)stopTimer();
  timer={aid,start:Date.now()};
  clearInterval(ti);
  ti=setInterval(function(){
    elapsed=Math.floor((Date.now()-timer.start)/1000);
    const bt=document.getElementById('ban-t');
    if(bt)bt.textContent=fmtFull(elapsed);
  },1000);
  const act=DB.acts.find(a=>a.id===aid);
  toast('▶ '+(act?act.emoji+' '+act.name:''));
  renderBan();render();
}

function stopTimer(){
  if(!timer)return;
  const dur=Math.floor((Date.now()-timer.start)/1000);
  const aid=timer.aid;
  clearInterval(ti);timer=null;elapsed=0;

  if(dur<30){toast('⚠️ Session trop courte');renderBan();render();return;}

  const sess={id:Date.now().toString(),aid,dur,day:getDay(),date:new Date().toISOString(),wk:getWk(),ua:0};
  DB.sess.push(sess);sv();

  const act=DB.acts.find(a=>a.id===aid);
  renderBan();render();

  if(act&&act.unit&&act.unit!=='none'){
    pendUnit={act,sess};
    showUnitPrompt();
  } else {
    showSummary(act,sess,0);
  }
}

// ── BANNER ────────────────────────────────────────────────
function renderBan(){
  const b=document.getElementById('ban');
  if(!timer){b.className='';b.innerHTML='';b.style.cssText='';return;}
  const act=DB.acts.find(a=>a.id===timer.aid);
  if(!act){b.className='';b.innerHTML='';return;}
  const cwk=getWk();
  const cwkS=DB.sess.filter(s=>s.wk===cwk);
  const tw=totFor(act.id,cwkS)+elapsed;
  const gw=act.goalW?act.goalW*3600:null;
  const gp=gw?Math.min(100,Math.round((tw/gw)*100)):null;
  b.className='on';
  b.style.cssText='background:'+act.color+'18;border:1px solid '+act.color+'55;border-radius:14px;padding:12px 15px;margin:0 14px 12px;display:flex;justify-content:space-between;align-items:center;max-width:572px;margin-left:auto;margin-right:auto;';
  b.innerHTML='<div><div style="font-size:10px;color:'+act.color+';font-weight:700;margin-bottom:2px">● EN COURS</div>'
    +'<div style="font-weight:800;font-size:15px">'+act.emoji+' '+act.name+'</div>'
    +(gp!==null?'<div style="font-size:10px;color:#888;margin-top:2px">Sem: '+gp+'% · '+fmtS(tw)+' / '+act.goalW+'h</div>':'')
    +'</div><div style="text-align:right">'
    +'<div id="ban-t" style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:'+act.color+'">'+fmtFull(elapsed)+'</div>'
    +'<button onclick="stopTimer()" style="margin-top:5px;padding:5px 14px;background:'+act.color+';border:none;border-radius:7px;color:#fff;font-weight:700;font-size:11px;width:100%;">■ Stop</button>'
    +'</div>';
}

// ── UNIT PROMPT ───────────────────────────────────────────

    +'<div style="font-size:12px;color:var(--mut);margin-top:3px;">'+fmtS(sess.dur)+' sur '+act.emoji+' '+act.name+'</div>'

    +'<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:11px;padding:14px;margin-bottom:13px;">'

    +'<button onclick="adjU(-1)">−</button>'

    +'<button onclick="adjU(1)">+</button>'
    +'</div>'
    +(ug?'<div style="margin-top:10px;"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:4px;"><span>Progression actuelle</span><span>'+ud+' / '+ug+' '+ul+'</span></div>'
    +'<div class="pgbar"><div class="pgbf" style="width:'+upct+'%;background:'+act.color+';"></div></div></div>':'')

    +'<button onclick="confU(false)" style="padding:12px;background:'+act.color+';border:none;border-radius:9px;color:#fff;font-weight:700;font-size:14px;">✅ Confirmer</button>'

function adjU(d){const i=document.getElementById('ui');if(i)i.value=Math.max(0,(parseInt(i.value)||0)+d);}
function confU(skip){
  if(!pendUnit)return;
  const ua=skip?0:(parseInt(document.getElementById('ui').value)||0);
  const idx=DB.sess.findIndex(s=>s.id===pendUnit.sess.id);
  if(idx>=0)DB.sess[idx].ua=ua;
  sv();closeModal();
  const {act,sess}=pendUnit;
  pendUnit=null;
  showSummary(act,{...sess,ua},ua);
}

// ── SESSION SUMMARY ───────────────────────────────────────
function showSummary(act,sess,ua){
  if(!act)return;
  const cwk=getWk();
  const cwkS=DB.sess.filter(s=>s.wk===cwk);
  const tw=totFor(act.id,cwkS);
  const tall=DB.sess.filter(s=>s.aid===act.id).reduce((a,s)=>a+s.dur,0);
  const gw=act.goalW?act.goalW*3600:null;
  const glt=act.goalLT?act.goalLT*3600:null;
  const gwp=gw?Math.min(100,Math.round((tw/gw)*100)):null;
  const gltp=glt?Math.min(100,Math.round((tall/glt)*100)):null;
  const tallH=Math.round(tall/3600*10)/10;
  const proj=act.goalLT?getProj(act):null;
  const mins=Math.floor(sess.dur/60);
  const mot=mins>=120?'💪 Excellente session ! Plus de 2h de concentration.':mins>=60?'🎯 Belle heure de travail. La régularité paie.':mins>=30?'✅ Session solide. Chaque minute compte.':'⚡ Court mais fait ! Mieux vaut peu que rien.';
  const streak=getStreak(act.id);
  const ud=act.unit&&act.unit!=='none'?getUDone(act):null;
  const ug=act.goalU||null;
  const ul=act.unit&&act.unit!=='none'?getULbl(act,true):'';
  const ut=UNITS.find(u=>u.id===act.unit);
  const up=ug?Math.min(100,Math.round((ud/ug)*100)):null;

  let html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">'
    +'<div style="width:46px;height:46px;border-radius:12px;background:'+act.color+'22;border:1px solid '+act.color+'44;display:flex;align-items:center;justify-content:center;font-size:22px;">'+act.emoji+'</div>'
    +'<div><div style="font-size:15px;font-weight:800;">Session terminée ✓</div><div style="font-size:12px;color:var(--mut);margin-top:2px;">'+act.name+'</div></div>'
    +'</div>'
    // Durée
    +'<div style="text-align:center;background:'+act.color+'14;border:1px solid '+act.color+'33;border-radius:13px;padding:18px;margin-bottom:13px;">'
    +'<div style="font-size:10px;color:'+act.color+';font-weight:700;letter-spacing:.4px;margin-bottom:5px;">DURÉE</div>'
    +'<div style="font-size:44px;font-weight:800;color:'+act.color+';letter-spacing:-1px;">'+fmtS(sess.dur)+'</div>'
    +'<div style="font-size:11px;color:var(--mut);margin-top:5px;">'+mot+'</div>'
    +(streak>1?'<div style="font-size:12px;color:var(--yel);font-weight:700;margin-top:7px;">🔥 Streak : '+streak+' jours</div>':'')
    +'</div>';

  // Unités
  if(ud!==null&&ua>0){
    html+='<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:11px;padding:12px 14px;margin-bottom:10px;">'
      +'<div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:6px;">'+(ut?ut.icon:'📊')+' '+ul.toUpperCase()+' CETTE SESSION</div>'
      +'<div style="font-size:20px;font-weight:800;color:'+act.color+';">+'+ua+' '+ul+'</div>'
      +(ug?'<div style="font-size:10px;color:var(--mut);margin-top:4px;">Total : '+ud+' / '+ug+' ('+up+'%)</div>'
        +'<div class="pgbar" style="margin-top:5px;"><div class="pgbf" style="width:'+up+'%;background:'+(up>=100?'var(--grn)':act.color)+';"></div></div>':'')
      +'</div>';
  }

  // Hebdo
  if(gw){
    html+='<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:11px;padding:12px 14px;margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:7px;">'
      +'<div style="font-size:10px;font-weight:700;color:var(--mut);">📅 OBJECTIF SEMAINE</div>'
      +'<div style="font-size:12px;font-weight:800;color:'+(gwp>=100?'var(--grn)':act.color)+'">'+gwp+'%</div>'
      +'</div>'
      +'<div class="pgbar"><div class="pgbf" style="width:'+gwp+'%;background:'+(gwp>=100?'var(--grn)':act.color)+'"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:5px;">'
      +'<span>'+fmtS(tw)+' faits</span>'
      +(gwp>=100?'<span style="color:var(--grn);">✅ Objectif atteint !</span>':'<span>'+fmtS(gw-tw)+' restants</span>')
      +'<span>/ '+act.goalW+'h</span>'
      +'</div></div>';
  }

  // Long terme
  if(glt){
    html+='<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:11px;padding:12px 14px;margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:7px;">'
      +'<div style="font-size:10px;font-weight:700;color:var(--mut);">🚀 OBJECTIF LONG TERME</div>'
      +'<div style="font-size:12px;font-weight:800;color:'+(gltp>=100?'var(--grn)':act.color)+'">'+gltp+'%</div>'
      +'</div>'
      +'<div class="pgbar"><div class="pgbf" style="width:'+gltp+'%;background:'+(gltp>=100?'var(--grn)':act.color)+'"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:5px;">'
      +'<span>'+tallH+'h</span>'
      +(gltp>=100?'<span style="color:var(--grn);">🏆 Accompli !</span>':'<span>'+Math.round(act.goalLT-tallH)+'h rest.</span>')
      +'<span>/ '+act.goalLT+'h</span>'
      +'</div>'
      +(proj&&!proj.done?'<div style="font-size:10px;color:var(--mut);margin-top:5px;text-align:center;">📅 Fin estimée : <strong style="color:'+act.color+'">'+proj.date.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</strong> · '+proj.weeks+' sem.</div>':'')
      +'</div>';
  }

  html+='<button onclick="closeModal()" style="width:100%;padding:12px;background:var(--acc);border:none;border-radius:9px;color:#fff;font-weight:700;font-size:14px;margin-top:4px;">Continuer 💪</button>';

  openModal('',html);

  // Check milestones
  const prevTw=tw-sess.dur;
  const prevTall=tall-sess.dur;
  const hitW=gw&&prevTw<gw&&tw>=gw;
  const hitLT=glt&&prevTall<glt&&tall>=glt;
  const hitU=ug&&(ud-ua)<ug&&ud>=ug;

  if(hitLT||hitU){
    setTimeout(()=>{closeModal();celebrate(hitLT?'lt':'unit',act,tall);},300);
  } else if(hitW){
    setTimeout(()=>{closeModal();celebrate('week',act,tw);},300);
  }
}

// ── CELEBRATION ───────────────────────────────────────────
function celebrate(type,act,sec){
  const cel=document.getElementById('cel');
  let title='',val='',sub='',lbl='',btn='';
  if(type==='lt'){
    title='Objectif long terme<br>accompli !';val=Math.round(sec/3600)+'h';lbl='/ '+act.goalLT+'h — 100%';
    sub='La régularité t\'a amené jusqu\'ici.<br>Continue sur ta lancée.';btn='🎉 Merci Seigneur !';
  } else if(type==='unit'){
    const ul=getULbl(act,true);
    title=ul.charAt(0).toUpperCase()+ul.slice(1)+' terminées !';val=getUDone(act)+' '+ul;lbl='Objectif atteint — 100%';
    sub='Tu as terminé ton objectif.<br>Belle discipline !';btn='🏆 Accompli !';
  } else {
    title='Objectif semaine<br>atteint !';val=fmtS(sec);lbl='/ '+act.goalW+'h cette semaine';
    sub='Belle semaine productive.<br>La discipline construit la destinée.';btn='🙌 Super !';
  }
  document.getElementById('cc').innerHTML=
    '<div class="ce">'+(type==='lt'?'🏆':type==='unit'?'📖':'🎯')+'</div>'
    +'<div class="ct2" style="color:'+(type==='lt'?'var(--grn)':act.color)+'">'+title+'</div>'
    +'<div class="cv" style="color:'+act.color+'">'+val+'</div>'
    +'<div class="csl">'+lbl+'</div>'
    +'<div class="csb">'+act.emoji+' <strong>'+act.name+'</strong><br>'+sub+'</div>'
    +'<button onclick="closeCel()" style="padding:13px 36px;background:'+(type==='lt'?'var(--grn)':act.color)+';border:none;border-radius:12px;color:'+(type==='lt'?'#000':'#fff')+';font-weight:800;font-size:14px;">'+btn+'</button>';
  launchConfetti(act.color);
  cel.classList.add('on');
}
function closeCel(){document.getElementById('cel').classList.remove('on');document.getElementById('cf').innerHTML='';}
function launchConfetti(c){
  const w=document.getElementById('cf');w.innerHTML='';
  const cols=[c,'#43D9A3','#FFB347','#FF6B6B','#4FC3F7','#F06292','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');el.className='cp2';
    const sz=Math.random()*9+4;
    el.style.cssText='left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';animation-duration:'+(Math.random()*2+1.5)+'s;animation-delay:'+(Math.random()*.8)+'s;border-radius:'+(Math.random()>.5?'50%':'2px')+';opacity:'+(Math.random()*.7+.3)+';';
    w.appendChild(el);
  }
  setTimeout(()=>{w.innerHTML='';},4000);
}

    name,color:nad.color,emoji:nad.emoji,days:[...nad.days],cat:nad.cat,
    rec:document.getElementById('f-rec').value,
    ts:document.getElementById('f-ts').value||null,
    te:document.getElementById('f-te').value||null,
    ed:document.getElementById('f-ed').value||null,
    unit,
    customU:unit==='custom'?(document.getElementById('f-cu').value.trim()||''):null,
    goalU:unit!=='none'?(parseFloat(document.getElementById('f-ug').value)||null):null,
    udone:unit!=='none'?(parseFloat(document.getElementById('f-ud').value)||0):0,
    goalW:parseFloat(document.getElementById('f-gw').value)||null,
    goalLT:parseFloat(document.getElementById('f-gl').value)||null,
    note:document.getElementById('f-nt').value.trim()
  };
  if(editId){DB.acts=DB.acts.map(a=>a.id===editId?Object.assign({},a,obj):a);toast('✅ '+name+' mis à jour');}
  else{DB.acts.push(Object.assign({id:Date.now().toString(),createdAt:new Date().toISOString()},obj));toast('✅ '+name+' créé !');}
  sv();closeModal();render();
}
function delAct(id){
  if(!confirm('Supprimer ?'))return;
  if(timer&&timer.aid===id)stopTimer();
  DB.acts=DB.acts.filter(a=>a.id!==id);
  DB.sess=DB.sess.filter(s=>s.aid!==id);
  sv();closeModal();toast('🗑 Supprimé');render();
}

// ── FICHE DÉTAILLÉE ───────────────────────────────────────
function openFiche(aid){
  const act=DB.acts.find(a=>a.id===aid);if(!act)return;
  const allS=DB.sess.filter(s=>s.aid===aid);
  const totalSec=allS.reduce((a,s)=>a+s.dur,0);
  const totalH=Math.round(totalSec/3600*10)/10;
  const streak=getStreak(aid);
  const avgSess=allS.length?Math.round(totalSec/allS.length):0;
  const allWks=[...new Set(DB.sess.map(s=>s.wk))];
  const bestWk=Math.max(...allWks.map(wk=>totFor(aid,DB.sess.filter(s=>s.wk===wk))),0);
  const actWks=allWks.filter(wk=>totFor(aid,DB.sess.filter(s=>s.wk===wk))>0).length;
  const ltH=act.goalLT||null;
  const ltp=ltH?Math.min(100,Math.round((totalH/ltH)*100)):null;
  const proj=ltH?getProj(act):null;
  const ud=act.unit&&act.unit!=='none'?getUDone(act):null;
  const ug=act.goalU||null;
  const ul=act.unit&&act.unit!=='none'?getULbl(act,true):'';
  const ut=UNITS.find(u=>u.id===act.unit);
  const up=ug?Math.min(100,Math.round((ud/ug)*100)):null;
  const last6=allWks.sort().slice(-6);
  const maxWkSec=Math.max(...last6.map(wk=>totFor(aid,DB.sess.filter(s=>s.wk===wk))),1);
  const recent=allS.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);

  let html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'
    +'<div style="width:48px;height:48px;border-radius:13px;background:'+act.color+'22;border:1px solid '+act.color+'44;display:flex;align-items:center;justify-content:center;font-size:24px;">'+act.emoji+'</div>'
    +'<div><div style="font-size:17px;font-weight:800;">'+act.name+'</div><div style="font-size:10px;color:var(--mut);margin-top:2px;">'+(act.cat||'')+(streak>0?' · 🔥 '+streak+'j streak':'')+'</div>'+(act.note?'<div style="font-size:11px;color:var(--mut);font-style:italic;margin-top:2px;">"'+act.note+'"</div>':'')+'</div>'
    +'</div>'
    +'<div class="fi">'
    +'<div class="fs"><div class="fsl">TOTAL CUMULÉ</div><div class="fsv" style="color:'+act.color+'">'+totalH+'h</div><div class="fss">'+allS.length+' sessions</div></div>'
    +'<div class="fs"><div class="fsl">STREAK</div><div class="fsv" style="color:var(--yel)">'+(streak>0?streak+'j':'—')+'</div><div class="fss">'+(streak>0?'🔥 consécutifs':'—')+'</div></div>'
    +'<div class="fs"><div class="fsl">MEILLEURE SEM.</div><div class="fsv">'+(bestWk>0?fmtS(bestWk):'—')+'</div><div class="fss">'+actWks+' sem. actives</div></div>'
    +'<div class="fs"><div class="fsl">MOY./SESSION</div><div class="fsv">'+(avgSess>0?fmtS(avgSess):'—')+'</div><div class="fss">durée moy.</div></div>'
    +'</div>';

  if(ltH){
    html+='<div style="background:'+act.color+'12;border:1px solid '+act.color+'33;border-radius:12px;padding:13px 14px;margin-bottom:13px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
      +'<div style="font-size:11px;font-weight:800;color:'+act.color+'">🚀 Objectif long terme</div>'
      +'<div style="font-size:17px;font-weight:800;color:'+(ltp>=100?'var(--grn)':act.color)+'">'+ltp+'%</div>'
      +'</div>'
      +'<div class="pgbar" style="height:11px;margin-bottom:7px;"><div class="pgbf" style="width:'+ltp+'%;background:'+(ltp>=100?'var(--grn)':act.color)+'"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:7px;">'
      +'<span><strong style="color:'+act.color+'">'+totalH+'h</strong> faites</span>'
      +(ltp>=100?'<span style="color:var(--grn);">🏆 Accompli !</span>':'<span><strong>'+Math.round(ltH-totalH)+'h</strong> restantes</span>')
      +'<span>/ <strong>'+ltH+'h</strong></span>'
      +'</div>'
      +(proj&&!proj.done?'<div style="background:var(--bg);border-radius:8px;padding:9px 11px;">'
        +'<div style="font-size:10px;color:var(--mut);margin-bottom:3px;font-weight:700;">📅 PROJECTION</div>'
        +'<div style="font-size:13px;font-weight:700;">Fin vers <span style="color:'+act.color+'">'+proj.date.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'</span></div>'
        +'<div style="font-size:11px;color:var(--mut);margin-top:2px;">'+proj.weeks+' semaines · à '+( act.goalW||'?')+'h/sem.</div>'
        +'</div>':'')
      +'</div>';
  }

  if(ug){
    html+='<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:12px;padding:12px 14px;margin-bottom:13px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">'
      +'<div style="font-size:10px;font-weight:700;color:var(--mut)">'+(ut?ut.icon:'📊')+' '+ul.toUpperCase()+'</div>'
      +'<div style="font-size:14px;font-weight:800;color:'+(up>=100?'var(--grn)':act.color)+'">'+up+'%</div>'
      +'</div>'
      +'<div class="pgbar" style="height:9px;margin-bottom:7px;"><div class="pgbf" style="width:'+up+'%;background:'+(up>=100?'var(--grn)':act.color)+'"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);">'
      +'<span>'+ud+' faits</span>'
      +(up>=100?'<span style="color:var(--grn);">✅ Terminé !</span>':'<span>'+(ug-ud)+' restants</span>')
      +'<span>/ '+ug+' '+ul+'</span>'
      +'</div></div>';
  }

  if(last6.length>0){
    html+='<div style="font-size:10px;color:var(--mut);font-weight:700;margin-bottom:7px;">📊 6 DERNIÈRES SEMAINES</div>'
      +'<div style="background:var(--bg);border:1px solid var(--bor2);border-radius:11px;padding:12px;margin-bottom:13px;">'
      +'<div class="wbars">'+last6.map(wk=>{
        const ws=totFor(aid,DB.sess.filter(s=>s.wk===wk));
        const pct=Math.round((ws/maxWkSec)*100);
        const cur=wk===getWk();
        return'<div class="wb"><div style="font-size:8px;color:'+(cur?act.color:'var(--mut)')+';height:12px;display:flex;align-items:flex-end;">'+(ws>0?fmtS(ws):'')+'</div><div class="wbf" style="height:'+Math.max(pct,3)+'%;background:'+(cur?act.color:act.color+'66')+';min-height:'+(ws>0?'4px':'2px')+';"></div><div class="wbl" style="color:'+(cur?'var(--txt)':'var(--mut)');font-weight:'+(cur?700:400)+';">'+wkLbl(wk).replace('Sem. ','')+'</div></div>';
      }).join('')+'</div>'
      +(act.goalW?'<div style="font-size:10px;color:var(--mut);display:flex;justify-content:space-between;margin-top:6px;"><span>Objectif : '+act.goalW+'h/sem</span><span>Moy. : '+(actWks>0?fmtS(Math.round(totalSec/actWks)):'—')+'/sem.</span></div>':'')
      +'</div>';
  }

  if(recent.length>0){
    html+='<div style="font-size:10px;color:var(--mut);font-weight:700;margin-bottom:7px;">🕐 SESSIONS RÉCENTES</div>'
      +recent.map(s=>{
        const d=new Date(s.date);
        return'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bor);">'
          +'<div><div style="font-size:12px;font-weight:600;">'+DAYS[s.day]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+'</div>'
          +'<div style="font-size:10px;color:var(--mut);margin-top:1px;">'+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+(s.ua?'<span style="color:'+act.color+';margin-left:6px;">+'+s.ua+' '+ul+'</span>':'')+'</div></div>'
          +'<div style="font-size:13px;font-weight:700;color:'+act.color+'">'+fmtS(s.dur)+'</div>'
          +'</div>';
      }).join('');
  }

  html+='<div class="g2" style="margin-top:14px;">'
    +'<button onclick="closeModal();startTimer(\''+aid+'\')" style="padding:12px;background:'+act.color+';border:none;border-radius:9px;color:#fff;font-weight:700;font-size:13px;">▶ Démarrer</button>'
    +'<button onclick="closeModal();openAdd(\''+aid+'\')" style="padding:12px;background:var(--sur2);border:1px solid var(--bor2);border-radius:9px;color:var(--mut);font-weight:700;font-size:13px;">✏️ Modifier</button>'
    +'</div>';

  openModal(act.emoji+' '+act.name,html);
}

// ── EXPORT ────────────────────────────────────────────────
function expCSV(sess){
  const rows=[['Semaine','Activité','Catégorie','Jour','Date','Durée (min)','Durée','Unités']];
  sess.forEach(s=>{
    const a=DB.acts.find(x=>x.id===s.aid);if(!a)return;
    rows.push([s.wk,a.name,a.cat||'',DAYS[s.day]||'',new Date(s.date).toLocaleDateString('fr-FR'),Math.round(s.dur/60),fmtFull(s.dur),s.ua||0]);
  });
  const csv=rows.map(r=>r.map(c=>'"'+c+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='timeflow_'+getWk()+'.csv';a.click();toast('⬇ CSV téléchargé');
}
function expSheets(sess){
  const lines=sess.map(s=>{const a=DB.acts.find(x=>x.id===s.aid);if(!a)return null;return[s.wk,a.name,a.cat||'',DAYS[s.day],new Date(s.date).toLocaleDateString('fr-FR'),Math.round(s.dur/60),fmtFull(s.dur),s.ua||0].join('\t');}).filter(Boolean);
  const txt='Semaine\tActivité\tCatégorie\tJour\tDate\tDurée (min)\tDurée\tUnités\n'+lines.join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('📋 Copié → colle dans Sheets'));
  else{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('📋 Copié');}
}

function go(t){
  tab=t;

    const el=document.getElementById('n-'+x);

  });

// ── RENDER ────────────────────────────────────────────────
function render(){
  try{
    renderBan();
    const today=getDay();
    const CWK=getWk();
    const dWK=dispWk||CWK;
    const isCWK=dWK===CWK;
    const wkS=DB.sess.filter(s=>s.wk===dWK);
    const cwkS=DB.sess.filter(s=>s.wk===CWK);
    const allWKs=[...new Set(DB.sess.map(s=>s.wk))].sort().reverse();
    const totWK=wkS.reduce((a,s)=>a+s.dur,0);
    const now=new Date();

    // DAY HEADER
    const dh=document.getElementById('dh');
    if(tab==='day'){
      dh.style.display='';
      const todayActs=DB.acts.filter(a=>a.days&&a.days.includes(today));
      const doneActs=todayActs.filter(a=>totDay(a.id,today,cwkS)>0);
      const todTot=cwkS.filter(s=>s.day===today).reduce((a,s)=>a+s.dur,0);
      const pct=todayActs.length>0?Math.round((doneActs.length/todayActs.length)*100):0;
      const hr=now.getHours();
      const greet=hr<12?'Bonjour 🌅':hr<18?'Bonne journée ☀️':'Bonne soirée 🌙';
      const next=DB.acts.filter(a=>a.days&&a.days.includes(today)&&a.ts).sort((a,b)=>t2m(a.ts)-t2m(b.ts)).find(a=>t2m(a.ts)>(hr*60+now.getMinutes()));
      dh.innerHTML='<div class="dg">'+greet+'</div>'
        +'<div class="dd">'+DAYSF[today]+' '+now.getDate()+' '+MONTHS[now.getMonth()]+(todTot>0?' · '+fmtS(todTot)+' trackés':'')+'</div>'
        +(next?'<div class="dn">⏳ Prochain : '+next.emoji+' '+next.name+' dans '+(()=>{const d=t2m(next.ts)-(hr*60+now.getMinutes());return d<60?d+'min':Math.floor(d/60)+'h'+(d%60?d%60+'min':'');})()+'</div>':'')
        +(todayActs.length>0?'<div class="dpb"><div class="dpf" style="width:'+pct+'%"></div></div><div class="dpl"><span>'+doneActs.length+'/'+todayActs.length+' activités démarrées</span><span>'+pct+'%</span></div>':'');
    } else {
      dh.style.display='none';
    }

    // TIMELINE
    const tlEl=document.getElementById('tl');
    if(tab==='day'){
      const timed=DB.acts.filter(a=>a.days&&a.days.includes(today)&&a.ts&&a.te&&(!a.ed||new Date(a.ed)>=new Date(new Date().toDateString())));
      if(timed.length>0){
        const allMin=timed.map(a=>t2m(a.ts));
        const allMax=timed.map(a=>{let e=t2m(a.te);return e<=t2m(a.ts)?e+1440:e;});
        const tlS=Math.max(0,Math.min(...allMin)-30);
        const tlE=Math.min(1440,Math.max(...allMax)+30);
        const tlD=tlE-tlS;
        const PPM=2.2;
        const H=tlD*PPM;
        const nowM=now.getHours()*60+now.getMinutes();
        const nowP=Math.max(0,Math.min(100,((nowM-tlS)/tlD)*100));
        let ticks='';
        for(let h=Math.floor(tlS/60);h<=Math.ceil(tlE/60);h++){
          const p=((h*60-tlS)/tlD)*100;
          if(p>=0&&p<=100)ticks+='<div class="ttick" style="top:'+p+'%">'+pad(h)+'h</div>';
        }
        let blocks='';
        timed.forEach(a=>{
          const sm=t2m(a.ts);let em=t2m(a.te);if(em<=sm)em+=1440;
          const tp=((sm-tlS)/tlD)*100;const hp=((em-sm)/tlD)*100;
          const isA=timer&&timer.aid===a.id;
          blocks+='<div class="tb" style="top:'+tp+'%;height:'+Math.max(hp,2.5)+'%;background:'+a.color+'22;--cc:'+a.color+';'+(isA?'box-shadow:0 0 10px '+a.color+'44;':'')+'" onclick="startTimer(\''+a.id+'\')">'
            +'<div class="tbn">'+a.emoji+' '+a.name+'</div>'
            +'<div class="tbt">'+a.ts+' – '+a.te+'</div>'
            +(totDay(a.id,today,cwkS)>0?'<div style="font-size:9px;color:'+a.color+';margin-top:1px">✓ '+fmtS(totDay(a.id,today,cwkS))+'</div>':'')
            +'</div>';
        });
        const nowLine=nowM>=tlS&&nowM<=tlE?'<div class="nline" style="top:'+nowP+'%"><div class="ndot"></div><div class="nlbl">'+pad(now.getHours())+':'+pad(now.getMinutes())+'</div></div>':'';
        tlEl.innerHTML='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:8px;">📅 PLANNING DU JOUR</div>'
          +'<div class="tlw" style="height:'+H+'px;min-height:100px;">'
          +'<div class="tax">'+ticks+'</div><div class="aline"></div>'+nowLine+blocks+'</div>';
      } else {
        tlEl.innerHTML='';
      }
    } else {
      tlEl.innerHTML='';
    }

    // MAIN CONTENT
    let html='';

    // ── DAY ──────────────────────────────────────────────
    if(tab==='day'){
      const todAll=DB.acts.filter(a=>a.days&&a.days.includes(today)&&(!a.ed||new Date(a.ed)>=new Date(new Date().toDateString())));
      if(todAll.length===0){
        html='<div class="empty"><div class="ej">🗓️</div><p>Aucune activité prévue aujourd\'hui.<br>Appuie sur <strong>+</strong> pour en créer une.</p></div>';
      } else {
        const timed=todAll.filter(a=>a.ts&&a.te).sort((a,b)=>t2m(a.ts)-t2m(b.ts));
        const untimed=todAll.filter(a=>!a.ts||!a.te);
        const nowM=now.getHours()*60+now.getMinutes();
        if(timed.length>0)html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:8px;">🕐 AVEC HORAIRE</div>';
        [...timed,...(timed.length>0&&untimed.length>0?[null]:untimed.length>0?[]:[]),...(timed.length>0&&untimed.length>0?untimed:[])].forEach(act=>{
          if(act===null){html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin:12px 0 8px;">📋 SANS HORAIRE FIXE</div>';return;}
          const isA=timer&&timer.aid===act.id;
          const tw=totFor(act.id,cwkS);
          const todT=totDay(act.id,today,cwkS)+(isA?elapsed:0);
          const gw=act.goalW?act.goalW*3600:null;
          const gwp=gw?Math.min(100,Math.round((tw/gw)*100)):null;
          const streak=getStreak(act.id);
          const isSlot=act.ts&&act.te&&nowM>=t2m(act.ts)&&nowM<t2m(act.te);
          const ud=act.unit&&act.unit!=='none'?getUDone(act):null;
          const ug=act.goalU||null;
          const ul=act.unit&&act.unit!=='none'?getULbl(act,true):'';
          const ut=UNITS.find(u=>u.id===act.unit);
          const up=ug?Math.min(100,Math.round((ud/ug)*100)):null;
          const ltDoneH=DB.sess.filter(s=>s.aid===act.id).reduce((a,s)=>a+s.dur,0)/3600+(isA?elapsed/3600:0);
          const ltGoalH=act.goalLT||null;
          const ltp=ltGoalH?Math.min(100,Math.round((ltDoneH/ltGoalH)*100)):null;
          html+='<div class="card'+(isA?' run':'')+'" style="--cc:'+act.color+';'+(isA?'border-color:'+act.color+';':isSlot?'border-color:'+act.color+'88;':'')+'\">'
            +'<div class="ch">'
            +'<div class="ci" style="background:'+act.color+'22;border:1px solid '+act.color+'44;" onclick="openFiche(\''+act.id+'\')">'+act.emoji+'</div>'
            +'<div style="flex:1;min-width:0;cursor:pointer;" onclick="openFiche(\''+act.id+'\')">'

            +'<div class="cm">Auj: <span style="color:#ccc">'+(todT>0?fmtS(todT):'—')+'</span> · Sem: <span style="color:'+act.color+'">'+(tw>0?fmtS(tw):'—')+'</span>'+(gwp!==null?' · <span style="color:'+(gwp>=100?'var(--grn)':'var(--mut)')+'">'+gwp+'% obj.</span>':'')+'</div>'

            +'</div></div>'

            +(gw?'<div style="margin-top:8px;"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-bottom:3px;"><span>📅 Sem: '+fmtS(tw)+' / '+act.goalW+'h</span><span style="color:'+(gwp>=100?'var(--grn)':'var(--mut)')+'">'+gwp+'%</span></div><div class="pb"><div class="pf" style="width:'+gwp+'%;background:'+(gwp>=100?'var(--grn)':act.color)+'"></div></div></div>':'')
            // Barre long terme
            +(ltGoalH?'<div style="margin-top:7px;padding:7px 9px;background:'+act.color+'0D;border-radius:8px;border:1px solid '+act.color+'22;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:10px;font-weight:700;color:'+act.color+'">🚀 Long terme</span><span style="font-size:11px;font-weight:800;color:'+(ltp>=100?'var(--grn)':act.color)+'">'+ltp+'%</span></div><div class="pb" style="height:6px;"><div class="pf" style="width:'+ltp+'%;background:'+(ltp>=100?'var(--grn)':act.color)+';height:100%;"></div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-top:4px;"><span>'+Math.round(ltDoneH*10)/10+'h</span><span>'+(ltp>=100?'🏆 Atteint !':Math.round(ltGoalH-ltDoneH)+'h rest.')+'</span><span>/ '+ltGoalH+'h</span></div></div>':'')
            // Barre unités
            +(ug?'<div style="margin-top:7px;padding:7px 9px;background:'+act.color+'0D;border-radius:8px;border:1px solid '+act.color+'22;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:10px;font-weight:700;color:'+act.color+'">'+(ut?ut.icon:'📊')+' '+ul.charAt(0).toUpperCase()+ul.slice(1)+'</span><span style="font-size:11px;font-weight:800;color:'+(up>=100?'var(--grn)':act.color)+'">'+up+'%</span></div><div class="pb" style="height:6px;"><div class="pf" style="width:'+up+'%;background:'+(up>=100?'var(--grn)':act.color)+';height:100%;"></div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-top:4px;"><span>'+ud+' faits</span><span>'+(up>=100?'✅ Terminé!':(ug-ud)+' rest.')+'</span><span>/ '+ug+' '+ul+'</span></div></div>':'')
            +'</div>';
        });
        const other=DB.acts.filter(a=>!a.days||!a.days.includes(today));
        if(other.length>0)html+='<div style="text-align:center;margin-top:12px;"><button onclick="showOther()" style="padding:7px 18px;background:var(--sur);border:1px solid var(--bor2);border-radius:18px;color:var(--mut);font-size:12px;font-weight:600;">+ '+other.length+' autres activités</button></div>';
      }
    }

    // ── PROGRESSION ───────────────────────────────────────
    else if(tab==='prog'){
      if(DB.acts.length===0){
        html='<div class="empty"><div class="ej">📈</div><p>Crée tes premières activités<br>pour voir ta progression ici.</p></div>';
      } else {
        DB.acts.forEach(function(act){
          const allS=DB.sess.filter(s=>s.aid===act.id);
          const totSec=allS.reduce((a,s)=>a+s.dur,0);
          const totH=Math.round(totSec/3600*10)/10;
          const streak=getStreak(act.id);
          const ltH=act.goalLT||null;
          const ltp=ltH?Math.min(100,Math.round((totH/ltH)*100)):null;
          const proj=ltH?getProj(act):null;
          const ud=act.unit&&act.unit!=='none'?getUDone(act):null;
          const ug=act.goalU||null;
          const ul=act.unit&&act.unit!=='none'?getULbl(act,true):'';
          const ut=UNITS.find(u=>u.id===act.unit);
          const up=ug?Math.min(100,Math.round((ud/ug)*100)):null;
          const last6=([...new Set(DB.sess.map(s=>s.wk))]).sort().slice(-6);
          const maxWS=Math.max.apply(null,last6.map(function(wk){return totFor(act.id,DB.sess.filter(function(s){return s.wk===wk;}));}).concat([1]));
          html+='<div class="pgc">'
            +'<div class="pgh">'
            +'<div class="pgi" style="background:'+act.color+'22;border:1px solid '+act.color+'44;">'+act.emoji+'</div>'
            +'<div style="flex:1;">'
            +'<div class="pgn">'+act.name+'</div>'
            +'<div class="pgm">'+(act.cat||'')+(streak>0?' · 🔥 '+streak+'j':'')+'</div>'
            +'</div>'
            +'<div style="text-align:right;">'
            +'<div class="pgt" style="color:'+act.color+'">'+totH+'h</div>'
            +'<div style="font-size:9px;color:var(--mut);">'+allS.length+' sess.</div>'
            +'</div></div>'
            // Barre LT
            +(ltH?'<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:4px;"><span>⏱ '+totH+'h / '+ltH+'h</span><span style="color:'+(ltp>=100?'var(--grn)':act.color)+';font-weight:700;">'+ltp+'%</span></div><div class="pgbar"><div class="pgbf" style="width:'+ltp+'%;background:'+(ltp>=100?'var(--grn)':act.color)+'"></div></div>'+(proj&&!proj.done?'<div style="font-size:10px;color:var(--mut);margin-top:4px;">📅 Fin estimée : <strong style="color:'+act.color+'">'+proj.date.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})+'</strong> · '+proj.weeks+' sem.</div>':'')+(ltp>=100?'<div style="font-size:10px;color:var(--grn);margin-top:3px;font-weight:700;">🏆 Objectif heures atteint !</div>':'')+'</div>':'')
            // Barre unités
            +(ug?'<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:4px;"><span>'+(ut?ut.icon:'📊')+' '+ud+' / '+ug+' '+ul+'</span><span style="color:'+(up>=100?'var(--grn)':act.color)+';font-weight:700;">'+up+'%</span></div><div class="pgbar"><div class="pgbf" style="width:'+up+'%;background:'+(up>=100?'var(--grn)':act.color)+'"></div></div>'+(up>=100?'<div style="font-size:10px;color:var(--grn);margin-top:3px;font-weight:700;">🏆 Terminé !</div>':'')+'</div>':'')
            // Graphe semaines
            +(last6.length>0?'<div style="margin-bottom:9px;"><div style="font-size:9px;color:var(--mut);margin-bottom:5px;">6 DERNIÈRES SEMAINES</div><div class="wbars">'+last6.map(function(wk){var ws=totFor(act.id,DB.sess.filter(function(s){return s.wk===wk;}));var pct=Math.round((ws/maxWS)*100);var cur=wk===CWK;return'<div class="wb"><div style="font-size:8px;color:'+(cur?act.color:'var(--mut)')+';height:11px;display:flex;align-items:flex-end;">'+(ws>0?fmtS(ws):'')+'</div><div class="wbf" style="height:'+Math.max(pct,3)+'%;background:'+(cur?act.color:act.color+'66')+';min-height:'+(ws>0?'4px':'2px')+';"></div><div class="wbl" style="color:'+(cur?'var(--txt)':'var(--mut)')+';font-weight:'+(cur?700:400)+';">'+wkLbl(wk).replace('Sem. ','')+'</div></div>';}).join('')+'</div></div>':'')
            +'<button onclick="openFiche(\''+act.id+'\')" style="width:100%;padding:8px;background:'+act.color+'18;border:1px solid '+act.color+'33;border-radius:8px;color:'+act.color+';font-size:12px;font-weight:700;">Fiche détaillée →</button>'
            +'</div>';
        });
      }
    }

    // ── DASHBOARD ─────────────────────────────────────────
    else if(tab==='dash'){
      const totAllSec=DB.sess.reduce((a,s)=>a+s.dur,0);
      const cwkTot=cwkS.reduce((a,s)=>a+s.dur,0);
      const awks=[...new Set(DB.sess.map(s=>s.wk))];
      const avgWk=awks.length?totAllSec/awks.length:0;
      html='<div style="padding-top:14px;">'
        +'<div class="sg">'
        +'<div class="sb"><div class="sl">CETTE SEMAINE</div><div class="sv" style="color:var(--acc)">'+fmtS(cwkTot)+'</div><div class="ss">'+cwkS.length+' sessions</div></div>'
        +'<div class="sb"><div class="sl">MOYENNE/SEMAINE</div><div class="sv">'+fmtS(Math.round(avgWk))+'</div><div class="ss">'+awks.length+' sem.</div></div>'
        +'<div class="sb"><div class="sl">TOTAL CUMULÉ</div><div class="sv">'+fmtS(totAllSec)+'</div><div class="ss">depuis le début</div></div>'
        +'<div class="sb"><div class="sl">ACTIVITÉS</div><div class="sv">'+DB.acts.length+'</div><div class="ss">'+DB.acts.filter(a=>a.days&&a.days.includes(today)).length+' auj.</div></div>'
        +'</div>';
      // Alertes
      var alerts=[];
      DB.acts.forEach(function(act){
        if(act.goalW){
          var done=totFor(act.id,cwkS);var goal=act.goalW*3600;var pct=Math.round((done/goal)*100);
          if(pct>=100)alerts.push({t:'g',i:'✅',ti:act.emoji+' '+act.name,m:'Objectif semaine atteint ! ('+fmtS(done)+' / '+act.goalW+'h)'});
          else if(pct<40&&today>=4)alerts.push({t:'d',i:'🚨',ti:act.emoji+' '+act.name,m:'Retard critique : '+pct+'% seulement. '+fmtS(goal-done)+' restantes.'});
          else if(pct<60&&today>=3)alerts.push({t:'w',i:'⚠️',ti:act.emoji+' '+act.name,m:'À la traîne : '+pct+'% de l\'objectif hebdo.'});
        }
        var streak=getStreak(act.id);
        if(streak>=7)alerts.push({t:'g',i:'🔥',ti:act.emoji+' '+act.name,m:streak+' jours de streak ! Incroyable.'});
        if(act.ed){var days=Math.ceil((new Date(act.ed)-new Date())/86400000);if(days<=3&&days>=0)alerts.push({t:'w',i:'📅',ti:act.emoji+' '+act.name,m:'Se termine '+(days===0?'aujourd\'hui':days===1?'demain':'dans '+days+' jours')+'.'});}
      });
      if(alerts.length>0){
        html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin:4px 0 9px;">🔔 ALERTES</div>';
        alerts.slice(0,5).forEach(function(a){html+='<div class="ab '+a.t+'"><div class="ai">'+a.i+'</div><div class="at"><strong>'+a.ti+'</strong>'+a.m+'</div></div>';});
      }
      // Répartition
      var catMap={};
      cwkS.forEach(function(s){var a=DB.acts.find(function(x){return x.id===s.aid;});if(!a)return;var c=a.cat||'Autre';catMap[c]=(catMap[c]||0)+s.dur;});
      var catE=Object.entries(catMap).sort(function(a,b){return b[1]-a[1];});
      if(catE.length>0){
        html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin:12px 0 9px;">⚖️ RÉPARTITION</div><div class="card">';
        catE.forEach(function(ce){
          var pct=cwkTot>0?Math.round((ce[1]/cwkTot)*100):0;
          var col=COLORS[CATS.indexOf(ce[0])%COLORS.length]||'#6C63FF';
          html+='<div class="cr"><div class="cl">'+ce[0]+'</div><div class="cbw"><div class="cbf" style="width:'+pct+'%;background:'+col+';height:100%;border-radius:4px;"></div></div><div class="ct">'+fmtS(ce[1])+'</div></div>';
        });
        html+='</div>';
      }
      // Projections
      var actsLT=DB.acts.filter(function(a){return a.goalLT;});
      if(actsLT.length>0){
        html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin:12px 0 9px;">🚀 PROJECTIONS</div><div class="pjb">';
        actsLT.forEach(function(act){
          var p=getProj(act);if(!p)return;
          if(p.done){html+='<div class="pjr"><div><div style="font-size:12px;font-weight:700;">'+act.emoji+' '+act.name+'</div><div style="font-size:10px;color:var(--grn);">🏆 Atteint !</div></div><div style="font-size:11px;font-weight:700;color:var(--grn);">100%</div></div>';}
          else{html+='<div class="pjr"><div><div style="font-size:12px;font-weight:700;">'+act.emoji+' '+act.name+'</div><div style="font-size:10px;color:var(--mut);">📅 '+p.date.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})+' · '+p.weeks+' sem.</div></div><div style="font-size:12px;font-weight:700;color:'+(p.weeks<=4?'var(--red)':p.weeks<=12?'var(--yel)':'var(--mut)')+'">'+p.pct+'%</div></div>';}
        });
        html+='</div>';
      }
      // Streaks
      html+='<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin:12px 0 9px;">🔥 RÉGULARITÉ — 30 JOURS</div>';
      DB.acts.slice(0,4).forEach(function(act){
        var days=getLast30(act.id);var streak=getStreak(act.id);
        html+='<div class="card" style="margin-bottom:9px;">'
          +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">'
          +'<div style="font-weight:700;font-size:13px;">'+act.emoji+' '+act.name+'</div>'
          +'<div style="font-size:11px;color:var(--yel);font-weight:700;">'+(streak>0?'🔥 '+streak+'j':'—')+'</div>'
          +'</div><div class="sgd">'
          +days.map(function(d,i){var isT=i===29;var cls='sd';if(d.sched){if(d.done>=300)cls+=' dk';else if(d.done>0)cls+=' dp2';else cls+=' dm';}if(isT)cls+=' dt';return'<div class="'+cls+'" title="'+d.date.getDate()+'/'+( d.date.getMonth()+1)+(d.done>0?' · '+fmtS(d.done):'')+'">'+d.date.getDate()+'</div>';}).join('')
          +'</div><div style="display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--mut);"><span style="color:var(--grn)">■</span> Fait <span style="color:var(--yel)">■</span> Partiel <span style="color:var(--red);opacity:.5">■</span> Manqué</div></div>';
      });
      html+='</div>';
    }

    // ── RECAP ─────────────────────────────────────────────
    else if(tab==='recap'){
      html='<div style="padding-top:14px;">'
        +'<div class="wsc"><button class="wch'+(dispWk===null?' on':'')+'" onclick="setW(null)">Sem. actuelle</button>'
        +allWKs.filter(function(w){return w!==CWK;}).map(function(w){return'<button class="wch'+(dispWk===w?' on':'')+'" onclick="setW(\''+w+'\')">'+wkLbl(w)+'</button>';}).join('')+'</div>'
        +'<div style="background:linear-gradient(135deg,var(--acc)22,var(--acc)08);border:1px solid var(--acc)33;border-radius:14px;padding:13px 15px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;">'
        +'<div><div style="font-size:10px;color:var(--acc);font-weight:700;">TOTAL '+(isCWK?'SEMAINE':'SÉLECT.')+'</div><div style="font-size:22px;font-weight:800;margin-top:3px;">'+(totWK>0?fmtS(totWK):'0m')+'</div><div style="font-size:10px;color:var(--mut);margin-top:2px;">'+wkS.length+' sessions</div></div>'
        +'<div style="display:flex;flex-direction:column;gap:6px;">'
        +'<button onclick="expCSV(DB.sess.filter(function(s){return s.wk===\''+dWK+'\';}))" style="padding:6px 11px;background:var(--grn)22;border:1px solid var(--grn)44;border-radius:7px;color:var(--grn);font-size:11px;font-weight:700;">⬇ CSV</button>'
        +'<button onclick="expSheets(DB.sess.filter(function(s){return s.wk===\''+dWK+'\';}))" style="padding:6px 11px;background:var(--blu)22;border:1px solid var(--blu)44;border-radius:7px;color:var(--blu);font-size:11px;font-weight:700;">📋 Sheets</button>'
        +'</div></div>';
      var sorted=[...DB.acts].sort(function(a,b){return totFor(b.id,wkS)-totFor(a.id,wkS);});
      var hasData=sorted.some(function(a){return totFor(a.id,wkS)>0;});
      if(!hasData){html+='<div class="empty"><div class="ej">📅</div><p>Aucune session cette semaine.</p></div>';}
      else{
        sorted.forEach(function(act){
          var tot=totFor(act.id,wkS);if(!tot&&!act.goalW)return;
          var pct=totWK>0?Math.round((tot/totWK)*100):0;
          var gp=act.goalW?Math.min(100,Math.round((tot/(act.goalW*3600))*100)):null;
          var maxD=Math.max.apply(null,DAYS.map(function(_,i){return totDay(act.id,i,wkS);}).concat([1]));
          html+='<div class="rr">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">'
            +'<div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;"><div style="width:9px;height:9px;border-radius:50%;background:'+act.color+'"></div>'+act.emoji+' '+act.name+'</div>'
            +'<div><span style="font-weight:700;color:'+act.color+'">'+(tot>0?fmtS(tot):'—')+'</span><span style="color:var(--mut);font-size:10px;margin-left:6px;">'+pct+'%</span></div>'
            +'</div>'
            +'<div class="pb" style="height:4px;margin-bottom:'+(gp!==null?'8px':'10px')+'"><div class="pf" style="width:'+pct+'%;background:'+act.color+'"></div></div>'
            +(gp!==null?'<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:10px;color:var(--mut)">🎯 Objectif '+act.goalW+'h</span><span style="font-size:10px;font-weight:700;color:'+(gp>=100?'var(--grn)':'var(--mut)')+'">'+gp+'% '+(gp>=100?'✓':'')+'</span></div><div class="pb" style="height:3px;margin-bottom:9px;"><div class="pf" style="width:'+gp+'%;background:'+(gp>=100?'var(--grn)':act.color)+'"></div></div>':'')
            +'<div class="dbs">'+DAYS.map(function(d,i){var dt=totDay(act.id,i,wkS);var isT=isCWK&&i===today;var bp=maxD>0?Math.round((dt/maxD)*100):0;return'<div class="dbc"><div class="dbbg"><div class="dbf" style="height:'+bp+'%;background:'+(dt>0?act.color+'BB':'transparent')+';"></div></div><div class="dbl'+(isT?' td':'')+'">'+d+'</div></div>';}).join('')+'</div>'
            +'</div>';
        });
      }
      html+='</div>';
    }

    // ── HISTORY ───────────────────────────────────────────
    else if(tab==='hist'){
      html='<div style="padding-top:14px;">'
        +'<div style="font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:12px;">TOUTES LES SEMAINES</div>'
        +'<div style="display:flex;gap:8px;margin-bottom:14px;">'
        +'<button onclick="expCSV(DB.sess)" style="flex:1;padding:10px;background:var(--grn)22;border:1px solid var(--grn)44;border-radius:8px;color:var(--grn);font-size:12px;font-weight:700;">⬇ Tout (CSV)</button>'
        +'<button onclick="expSheets(DB.sess)" style="flex:1;padding:10px;background:var(--blu)22;border:1px solid var(--blu)44;border-radius:8px;color:var(--blu);font-size:12px;font-weight:700;">📋 Tout → Sheets</button>'
        +'</div>';
      if(allWKs.length===0){html+='<div class="empty"><div class="ej">🗂️</div><p>Lance ton premier timer !</p></div>';}
      else{
        allWKs.forEach(function(wk){
          var wkSs=DB.sess.filter(function(s){return s.wk===wk;});
          var wkT=wkSs.reduce(function(a,s){return a+s.dur;},0);
          var tags=DB.acts.map(function(act){var t=totFor(act.id,wkSs);if(!t)return'';return'<span class="ht" style="background:'+act.color+'22;color:'+act.color+';border:1px solid '+act.color+'44;">'+act.emoji+' '+act.name+' · '+fmtS(t)+'</span>';}).join('');
          html+='<div class="hc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">'
            +'<div><div style="font-size:13px;font-weight:700;">'+(wk===CWK?'📍 Sem. actuelle':wkLbl(wk))+'</div><div style="font-size:10px;color:var(--mut);margin-top:2px;">'+wkSs.length+' sessions</div></div>'
            +'<div style="font-size:15px;font-weight:800;color:var(--acc)">'+fmtS(wkT)+'</div>'
            +'</div><div class="htg">'+tags+'</div>'
            +'<button onclick="setW(\''+wk+'\');go(\'recap\')" style="padding:5px 12px;background:var(--sur2);border:none;border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;">Voir le détail →</button>'
            +'</div>';
        });
      }
      html+='</div>';
    }

    document.getElementById('mc').innerHTML=html;
  } catch(e) {
    console.error('Render error:',e);
    document.getElementById('mc').innerHTML='<div style="padding:20px;color:var(--red);font-size:13px;">⚠️ Erreur: '+e.message+'<br><small>'+e.stack+'</small></div>';
  }
}

function setW(wk){dispWk=wk;render();}

function showOther(){
  var today=getDay();
  var other=DB.acts.filter(function(a){return !a.days||!a.days.includes(today);});
  openModal('📋 Autres activités ('+other.length+')',
    other.map(function(act){return'<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bor);">'
      +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<div style="width:32px;height:32px;border-radius:8px;background:'+act.color+'22;display:flex;align-items:center;justify-content:center;font-size:16px;">'+act.emoji+'</div>'
      +'<div><div style="font-weight:600;font-size:13px;">'+act.name+'</div><div style="font-size:10px;color:var(--mut);">'+(act.days&&act.days.length>0?act.days.map(function(d){return DAYS[d];}).join(', '):'Aucun jour')+'</div></div></div>'
      +'<button onclick="startTimer(\''+act.id+'\');closeModal()" style="padding:6px 11px;background:'+act.color+'22;border:1px solid '+act.color+'44;border-radius:7px;color:'+act.color+';font-size:11px;font-weight:700;">▶</button>'
      +'</div>';}).join('')
    +'<button class="pbtn" style="margin-top:12px;" onclick="closeModal()">Fermer</button>'
  );
}

// PWA
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
let dP;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dP=e;if(window.matchMedia('(display-mode: standalone)').matches)return;var b=document.createElement('div');b.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--acc)55;padding:10px 14px;border-radius:11px;font-size:12px;font-weight:600;z-index:199;display:flex;gap:9px;align-items:center;box-shadow:0 4px 16px #00000099;white-space:nowrap;';b.innerHTML='<span>📲 Installer TimeFlow</span><button onclick="iPWA()" style="padding:5px 12px;background:var(--acc);border:none;border-radius:7px;color:#fff;font-weight:700;font-size:12px;">Installer</button><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#555;font-size:16px;">✕</button>';document.body.appendChild(b);});
async function iPWA(){if(!dP)return;dP.prompt();await dP.userChoice;dP=null;}

// Init
